<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgData" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1e2e" />
      <stop offset="100%" stop-color="#040b12" />
    </linearGradient>
  </defs>

  <rect width="600" height="360" rx="16" fill="url(#bgData)" stroke="rgba(6, 182, 212, 0.35)" stroke-width="2" />
  <path d="M0 60 H600 M0 120 H600 M0 180 H600 M0 240 H600 M0 300 H600 M60 0 V360 M120 0 V360 M180 0 V360 M240 0 V360 M300 0 V360 M360 0 V360 M420 0 V360 M480 0 V360 M540 0 V360" stroke="rgba(255,255,255,0.03)" stroke-width="1" />

  <!-- Top bar -->
  <rect x="24" y="20" width="552" height="36" rx="8" fill="#132a3d" stroke="rgba(6, 182, 212, 0.3)" />
  <circle cx="44" cy="38" r="5" fill="#ef4444" />
  <circle cx="60" cy="38" r="5" fill="#f59e0b" />
  <circle cx="76" cy="38" r="5" fill="#10b981" />
  <text x="100" y="43" fill="#67e8f9" font-family="'Fira Code', monospace" font-size="12">datainsight-etl.pipeline :: High-Volume PDF Parsing &amp; PostgreSQL Lake</text>
  <rect x="470" y="26" width="94" height="24" rx="12" fill="rgba(6,182,212,0.2)" stroke="#06b6d4" stroke-width="1" />
  <text x="480" y="42" fill="#06b6d4" font-family="sans-serif" font-size="11" font-weight="bold">50K+ RECORDS</text>

  <!-- Left: Public Unstructured PDF Ingestion -->
  <g transform="translate(30, 75)">
    <rect width="160" height="250" rx="10" fill="#0e2436" stroke="rgba(6,182,212,0.25)" />
    <text x="14" y="26" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold">PDF GAZETTE INGESTION</text>

    <!-- PDF Document Card -->
    <rect x="14" y="42" width="132" height="130" rx="8" fill="#091824" stroke="rgba(56,189,248,0.4)" stroke-width="1" />
    <text x="24" y="66" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="bold">📄 Official Gazettes</text>
    <rect x="24" y="78" width="112" height="4" rx="2" fill="#38bdf8" />
    <rect x="24" y="88" width="90" height="4" rx="2" fill="#64748b" />
    <rect x="24" y="98" width="105" height="4" rx="2" fill="#64748b" />
    <rect x="24" y="108" width="80" height="4" rx="2" fill="#64748b" />
    <rect x="24" y="118" width="112" height="4" rx="2" fill="#64748b" />
    <rect x="24" y="128" width="60" height="4" rx="2" fill="#64748b" />
    <text x="24" y="152" fill="#10b981" font-family="sans-serif" font-size="9">● Daily Automated Ingest</text>

    <rect x="14" y="184" width="132" height="52" rx="6" fill="rgba(6,182,212,0.15)" stroke="#06b6d4" />
    <text x="22" y="204" fill="#67e8f9" font-family="sans-serif" font-size="10" font-weight="bold">Multi-Page PDF Batch</text>
    <text x="22" y="220" fill="#94a3b8" font-family="sans-serif" font-size="8">pdfminer.six + pdfrw</text>
  </g>

  <!-- Center: Parsing Engine & Regex Normalizer -->
  <g transform="translate(210, 75)">
    <rect width="180" height="250" rx="10" fill="#0e2436" stroke="rgba(16,185,129,0.35)" />
    <text x="14" y="26" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="bold">PARSING &amp; OCR ENGINE</text>

    <rect x="14" y="42" width="152" height="88" rx="8" fill="#091824" stroke="#10b981" stroke-width="1.5" />
    <text x="24" y="66" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="bold">⚙️ Structural Tokenizer</text>
    <text x="24" y="84" fill="#cbd5e1" font-family="sans-serif" font-size="9">Fault-Tolerant Regex Matrix</text>
    <text x="24" y="100" fill="#10b981" font-family="sans-serif" font-size="9">● 99.8% Extraction Accuracy</text>
    <text x="24" y="114" fill="#94a3b8" font-family="sans-serif" font-size="8">Anomaly &amp; Outlier Detection</text>

    <rect x="14" y="140" width="152" height="90" rx="8" fill="#091824" stroke="#06b6d4" stroke-width="1.5" />
    <text x="24" y="164" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold">🔄 Data Normalization</text>
    <text x="24" y="182" fill="#cbd5e1" font-family="sans-serif" font-size="9">Schema mapping &amp; cleaning</text>
    <text x="24" y="198" fill="#10b981" font-family="sans-serif" font-size="9">● Zero duplicate guarantee</text>
    <text x="24" y="214" fill="#94a3b8" font-family="sans-serif" font-size="8">Deduplication hashes</text>
  </g>

  <!-- Right: PostgreSQL Data Lake & Analytics -->
  <g transform="translate(410, 75)">
    <rect width="160" height="250" rx="10" fill="#0e2436" stroke="rgba(6,182,212,0.25)" />
    <text x="14" y="26" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold">POSTGRES LAKE &amp; BI</text>

    <rect x="12" y="44" width="136" height="60" rx="6" fill="#091824" stroke="rgba(56,189,248,0.4)" />
    <text x="20" y="66" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold">🐘 PostgreSQL 16 Lake</text>
    <text x="20" y="82" fill="#cbd5e1" font-family="sans-serif" font-size="9">50,000+ Normalized Rows</text>
    <text x="20" y="94" fill="#10b981" font-family="sans-serif" font-size="8">&lt;2ms B-tree queries</text>

    <!-- Mini chart box -->
    <rect x="12" y="114" width="136" height="58" rx="6" fill="#091824" stroke="rgba(16,185,129,0.4)" />
    <text x="20" y="132" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="bold">📊 Longitudinal Stats</text>
    <!-- Bar charts -->
    <g transform="translate(20, 140)">
      <rect x="0" y="12" width="12" height="16" fill="#06b6d4" rx="2" />
      <rect x="18" y="6" width="12" height="22" fill="#10b981" rx="2" />
      <rect x="36" y="2" width="12" height="26" fill="#3b82f6" rx="2" />
      <rect x="54" y="8" width="12" height="20" fill="#8b5cf6" rx="2" />
      <rect x="72" y="0" width="12" height="28" fill="#10b981" rx="2" />
      <rect x="90" y="4" width="12" height="24" fill="#06b6d4" rx="2" />
    </g>

    <rect x="12" y="182" width="136" height="46" rx="6" fill="rgba(16,185,129,0.15)" stroke="#10b981" />
    <text x="20" y="202" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="bold">Automated ETL</text>
    <text x="20" y="216" fill="#94a3b8" font-family="sans-serif" font-size="8">100% Unattended Cron</text>
  </g>

  <!-- Connectors -->
  <path d="M 190 200 L 210 200" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4" />
  <path d="M 390 200 L 410 200" stroke="#10b981" stroke-width="2" stroke-dasharray="4" />
</svg>
