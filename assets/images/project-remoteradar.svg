<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradRadar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1526" />
      <stop offset="100%" stop-color="#050a14" />
    </linearGradient>
    <linearGradient id="cyanGradRadar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="purpleGradRadar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="600" height="360" rx="16" fill="url(#bgGradRadar)" stroke="rgba(6, 182, 212, 0.25)" stroke-width="2" />
  
  <!-- Subtle Grid -->
  <path d="M0 60 H600 M0 120 H600 M0 180 H600 M0 240 H600 M0 300 H600 M60 0 V360 M120 0 V360 M180 0 V360 M240 0 V360 M300 0 V360 M360 0 V360 M420 0 V360 M480 0 V360 M540 0 V360" stroke="rgba(255,255,255,0.03)" stroke-width="1" />

  <!-- Top Bar -->
  <rect x="24" y="20" width="552" height="36" rx="8" fill="#111c38" stroke="rgba(6, 182, 212, 0.2)" />
  <circle cx="44" cy="38" r="5" fill="#ef4444" />
  <circle cx="60" cy="38" r="5" fill="#f59e0b" />
  <circle cx="76" cy="38" r="5" fill="#10b981" />
  <text x="80" y="43" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="10.5">remoteradar-ai :: FastAPI + Gemini AI</text>
  <rect x="475" y="26" width="90" height="24" rx="12" fill="rgba(16,185,129,0.2)" stroke="#10b981" stroke-width="1" />
  <text x="488" y="42" fill="#10b981" font-family="sans-serif" font-size="10" font-weight="bold">⚡ LIVE 200</text>

  <!-- Left: Scraper Engine Nodes -->
  <g transform="translate(30, 80)">
    <rect width="150" height="240" rx="10" fill="#0d182e" stroke="rgba(6,182,212,0.3)" />
    <text x="14" y="26" fill="#38bdf8" font-family="sans-serif" font-size="10.5" font-weight="bold">SCRAPER ENGINE</text>
    
    <rect x="12" y="40" width="126" height="36" rx="6" fill="#152442" />
    <text x="20" y="58" fill="#f1f5f9" font-family="sans-serif" font-size="11">LinkedIn Scraper</text>
    <text x="20" y="70" fill="#10b981" font-family="sans-serif" font-size="9">● Polling (2h) 99.8%</text>

    <rect x="12" y="86" width="126" height="36" rx="6" fill="#152442" />
    <text x="20" y="104" fill="#f1f5f9" font-family="sans-serif" font-size="11">ATS Greenhouse</text>
    <text x="20" y="116" fill="#10b981" font-family="sans-serif" font-size="9">● Webhook active</text>

    <rect x="12" y="132" width="126" height="36" rx="6" fill="#152442" />
    <text x="20" y="150" fill="#f1f5f9" font-family="sans-serif" font-size="11">RemoteFR / Lever</text>
    <text x="20" y="162" fill="#10b981" font-family="sans-serif" font-size="9">● Sync OK (34 new)</text>

    <rect x="12" y="180" width="126" height="46" rx="6" fill="rgba(6,182,212,0.1)" stroke="#06b6d4" stroke-width="1" />
    <text x="20" y="200" fill="#06b6d4" font-family="sans-serif" font-size="11" font-weight="bold">Async Pipeline</text>
    <text x="20" y="216" fill="#94a3b8" font-family="sans-serif" font-size="10">Deduplication 100%</text>
  </g>

  <!-- Center: AI Matching Engine -->
  <g transform="translate(205, 80)">
    <rect width="190" height="240" rx="10" fill="#13132b" stroke="#8b5cf6" stroke-width="1.5" />
    
    <circle cx="95" cy="55" r="28" fill="url(#purpleGradRadar)" />
    <path d="M85 55 L95 43 L105 55 L95 67 Z" fill="#ffffff" />
    <text x="95" y="102" fill="#c084fc" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">GEMINI PRO AI</text>
    <text x="95" y="118" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Semantic Fit &amp; Match</text>

    <!-- Score Bar -->
    <rect x="20" y="136" width="150" height="28" rx="14" fill="#1e1b4b" />
    <rect x="20" y="136" width="138" height="28" rx="14" fill="url(#cyanGradRadar)" />
    <text x="95" y="155" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Match Score: 94%</text>

    <!-- Custom CV Generation Output -->
    <rect x="20" y="176" width="150" height="50" rx="8" fill="#201c40" stroke="rgba(139,92,246,0.3)" />
    <text x="30" y="196" fill="#a855f7" font-family="sans-serif" font-size="11" font-weight="bold">📄 Auto-CV PDF Engine</text>
    <text x="30" y="214" fill="#e2e8f0" font-family="sans-serif" font-size="10">Tailored Skills Highlighted</text>
  </g>

  <!-- Right: Dispatch Hub -->
  <g transform="translate(420, 80)">
    <rect width="150" height="240" rx="10" fill="#0d182e" stroke="rgba(6,182,212,0.3)" />
    <text x="14" y="26" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold">INSTANT DISPATCH</text>

    <rect x="12" y="44" width="126" height="52" rx="6" fill="#152442" stroke="rgba(59,130,246,0.4)" />
    <text x="20" y="64" fill="#60a5fa" font-family="sans-serif" font-size="11" font-weight="bold">⚡ Telegram Bot</text>
    <text x="20" y="82" fill="#cbd5e1" font-family="sans-serif" font-size="9">Alert sent in 180ms</text>

    <rect x="12" y="108" width="126" height="52" rx="6" fill="#152442" stroke="rgba(139,92,246,0.4)" />
    <text x="20" y="128" fill="#a78bfa" font-family="sans-serif" font-size="11" font-weight="bold">🎮 Discord Webhook</text>
    <text x="20" y="146" fill="#cbd5e1" font-family="sans-serif" font-size="9">Rich Embed + PDF link</text>

    <rect x="12" y="172" width="126" height="54" rx="6" fill="rgba(16,185,129,0.15)" stroke="#10b981" stroke-width="1" />
    <text x="20" y="192" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="bold">📊 Web Kanban</text>
    <text x="20" y="212" fill="#94a3b8" font-family="sans-serif" font-size="9">Live Candidate Tracker</text>
  </g>

  <!-- Connectors -->
  <path d="M 180 200 L 205 200" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4" />
  <path d="M 395 200 L 420 200" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="4" />
</svg>
