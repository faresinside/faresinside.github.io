    <text x="20" y="124" fill="#10b981" font-family="sans-serif" font-size="9">● 150+ Apps Orchestrated</text>

    <rect x="12" y="142" width="141" height="42" rx="6" fill="#0f172a" />
    <text x="20" y="160" fill="#f8fafc" font-family="sans-serif" font-size="11">Docker Multi-Stage</text>
    <text x="20" y="174" fill="#10b981" font-family="sans-serif" font-size="9">● Hardened Base Images</text>

