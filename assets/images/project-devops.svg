  <!-- Connectors -->
  <path d="M 195 200 L 210 200" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4" />
  <path d="M 390 200 L 405 200" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4" />
