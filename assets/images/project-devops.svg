    <text x="20" y="200" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="bold">Publicis / Yvelines / Vocalcom</text>
    <text x="20" y="216" fill="#94a3b8" font-family="sans-serif" font-size="8">Tier-1 Enterprise Trust</text>
