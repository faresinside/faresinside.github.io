<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCity" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1a2e" />
      <stop offset="100%" stop-color="#030812" />
    </linearGradient>
  </defs>

  <rect width="600" height="360" rx="16" fill="url(#bgCity)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="2" />
  <path d="M0 60 H600 M0 120 H600 M0 180 H600 M0 240 H600 M0 300 H600 M60 0 V360 M120 0 V360 M180 0 V360 M240 0 V360 M300 0 V360 M360 0 V360 M420 0 V360 M480 0 V360 M540 0 V360" stroke="rgba(255,255,255,0.03)" stroke-width="1" />

  <!-- Top bar -->
  <rect x="24" y="20" width="552" height="36" rx="8" fill="#13263d" stroke="rgba(56, 189, 248, 0.3)" />
  <circle cx="44" cy="38" r="5" fill="#ef4444" />
  <circle cx="60" cy="38" r="5" fill="#f59e0b" />
  <circle cx="76" cy="38" r="5" fill="#10b981" />
  <text x="100" y="43" fill="#7dd3fc" font-family="'Fira Code', monospace" font-size="12">citypulse-geo.api :: FastAPI + Zero-Dependency In-Memory TTL Cache</text>
  <rect x="470" y="26" width="94" height="24" rx="12" fill="rgba(56,189,248,0.2)" stroke="#38bdf8" stroke-width="1" />
  <text x="485" y="42" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold">&lt;5ms API</text>

  <!-- Left: Public City Feeds Ingestion -->
  <g transform="translate(30, 75)">
    <rect width="160" height="250" rx="10" fill="#0f2136" stroke="rgba(56,189,248,0.25)" />
    <text x="14" y="26" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold">PUBLIC OPEN DATA</text>

    <rect x="12" y="42" width="136" height="42" rx="6" fill="#091624" />
    <text x="20" y="60" fill="#f0f9ff" font-family="sans-serif" font-size="11">Municipal Events</text>
    <text x="20" y="74" fill="#38bdf8" font-family="sans-serif" font-size="9">● Cultural &amp; Expo Feeds</text>

    <rect x="12" y="92" width="136" height="42" rx="6" fill="#091624" />
    <text x="20" y="110" fill="#f0f9ff" font-family="sans-serif" font-size="11">Sports Fixtures</text>
    <text x="20" y="124" fill="#38bdf8" font-family="sans-serif" font-size="9">● Real-time venue status</text>

    <rect x="12" y="142" width="136" height="42" rx="6" fill="#091624" />
    <text x="20" y="160" fill="#f0f9ff" font-family="sans-serif" font-size="11">Geo Points of Interest</text>
    <text x="20" y="174" fill="#38bdf8" font-family="sans-serif" font-size="9">● Coordinates &amp; Metro</text>

    <rect x="12" y="192" width="136" height="46" rx="6" fill="rgba(56,189,248,0.15)" stroke="#38bdf8" />
    <text x="20" y="212" fill="#7dd3fc" font-family="sans-serif" font-size="10" font-weight="bold">Upstream Protection</text>
    <text x="20" y="226" fill="#94a3b8" font-family="sans-serif" font-size="8">Zero rate-limit blockage</text>
  </g>

  <!-- Center: In-Memory TTL Cache Engine -->
  <g transform="translate(210, 75)">
    <rect width="180" height="250" rx="10" fill="#0f2136" stroke="rgba(16,185,129,0.4)" />
    <text x="14" y="26" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="bold">IN-MEMORY CACHE CORE</text>

    <rect x="14" y="42" width="152" height="90" rx="8" fill="#091624" stroke="#10b981" stroke-width="1.5" />
    <text x="24" y="66" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="bold">⚡ Fast TTL In-Memory</text>
    <text x="24" y="84" fill="#cbd5e1" font-family="sans-serif" font-size="9">Auto Invalidation: 300s</text>
    <text x="24" y="100" fill="#10b981" font-family="sans-serif" font-size="9">● 0 External DB Latency</text>
    <text x="24" y="116" fill="#94a3b8" font-family="sans-serif" font-size="8">Thread-Safe Dict Ingestion</text>

    <rect x="14" y="142" width="152" height="88" rx="8" fill="#091624" stroke="#38bdf8" stroke-width="1.5" />
    <text x="24" y="166" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold">🚀 FastAPI Async Router</text>
    <text x="24" y="184" fill="#cbd5e1" font-family="sans-serif" font-size="9">Sub-5ms JSON Response</text>
    <text x="24" y="200" fill="#10b981" font-family="sans-serif" font-size="9">● Uvicorn + Jinja2 UI</text>
    <text x="24" y="216" fill="#94a3b8" font-family="sans-serif" font-size="8">Dockerized Container Ready</text>
  </g>

  <!-- Right: Client Apps & Dashboards -->
  <g transform="translate(410, 75)">
    <rect width="160" height="250" rx="10" fill="#0f2136" stroke="rgba(56,189,248,0.25)" />
    <text x="14" y="26" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold">CONSUMERS &amp; WEB UI</text>

    <rect x="12" y="44" width="136" height="60" rx="6" fill="#091624" stroke="rgba(56,189,248,0.4)" />
    <text x="20" y="66" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold">📱 Responsive UI</text>
    <text x="20" y="82" fill="#cbd5e1" font-family="sans-serif" font-size="9">Mobile &amp; Desktop Views</text>
    <text x="20" y="94" fill="#10b981" font-family="sans-serif" font-size="8">● Instant rendering</text>

    <rect x="12" y="112" width="136" height="60" rx="6" fill="#091624" stroke="rgba(16,185,129,0.4)" />
    <text x="20" y="134" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="bold">🌐 REST API Endpoint</text>
    <text x="20" y="150" fill="#cbd5e1" font-family="sans-serif" font-size="9">Clean JSON Contracts</text>
    <text x="20" y="162" fill="#10b981" font-family="sans-serif" font-size="8">● Swagger / OpenAPI docs</text>

    <rect x="12" y="180" width="136" height="48" rx="6" fill="rgba(16,185,129,0.15)" stroke="#10b981" />
    <text x="20" y="200" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="bold">99.99% Uptime</text>
    <text x="20" y="216" fill="#94a3b8" font-family="sans-serif" font-size="8">Zero maintenance overhead</text>
  </g>

  <!-- Connectors -->
  <path d="M 190 200 L 210 200" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4" />
  <path d="M 390 200 L 410 200" stroke="#10b981" stroke-width="2" stroke-dasharray="4" />
</svg>
