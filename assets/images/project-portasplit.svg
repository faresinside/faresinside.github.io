  <!-- Connectors -->
  <path d="M 190 200 L 210 200" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4" />
  <path d="M 390 200 L 410 200" stroke="#a855f7" stroke-width="2" stroke-dasharray="4" />
</svg>
