<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradScan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1520" />
      <stop offset="100%" stop-color="#050a12" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <rect width="600" height="360" rx="16" fill="url(#bgGradScan)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="2" />
  <path d="M0 60 H600 M0 120 H600 M0 180 H600 M0 240 H600 M0 300 H600 M60 0 V360 M120 0 V360 M180 0 V360 M240 0 V360 M300 0 V360 M360 0 V360 M420 0 V360 M480 0 V360 M540 0 V360" stroke="rgba(255,255,255,0.03)" stroke-width="1" />

  <!-- Top bar -->
  <rect x="24" y="20" width="552" height="36" rx="8" fill="#0f2324" stroke="rgba(16, 185, 129, 0.25)" />
  <circle cx="44" cy="38" r="5" fill="#ef4444" />
  <circle cx="60" cy="38" r="5" fill="#f59e0b" />
  <circle cx="76" cy="38" r="5" fill="#10b981" />
  <text x="100" y="43" fill="#6ee7b7" font-family="'Fira Code', monospace" font-size="12">scancraft-mobile :: Offline-First React Native + Fastify Microservices</text>
  <rect x="470" y="26" width="94" height="24" rx="12" fill="rgba(16,185,129,0.2)" stroke="#10b981" stroke-width="1" />
  <text x="480" y="42" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="bold">⚡ &lt;10ms CACHE</text>

  <!-- Mobile Mockup Phone Left -->
  <g transform="translate(45, 75)">
    <!-- Phone frame -->
    <rect width="140" height="255" rx="18" fill="#0c1d24" stroke="#10b981" stroke-width="2" />
    <rect x="40" y="6" width="60" height="6" rx="3" fill="#1b3842" />
    
    <!-- Camera Viewport Box -->
    <rect x="14" y="24" width="112" height="110" rx="8" fill="#081419" stroke="rgba(16,185,129,0.4)" stroke-dasharray="4" />
    
    <!-- Laser scan line -->
    <line x1="20" y1="80" x2="120" y2="80" stroke="#ef4444" stroke-width="2" />
    <!-- Barcode simulation -->
    <rect x="30" y="50" width="4" height="50" fill="#ffffff" />
    <rect x="38" y="50" width="8" height="50" fill="#ffffff" />
    <rect x="50" y="50" width="3" height="50" fill="#ffffff" />
    <rect x="58" y="50" width="6" height="50" fill="#ffffff" />
    <rect x="68" y="50" width="10" height="50" fill="#ffffff" />
    <rect x="82" y="50" width="4" height="50" fill="#ffffff" />
    <rect x="90" y="50" width="7" height="50" fill="#ffffff" />
    <rect x="102" y="50" width="4" height="50" fill="#ffffff" />

    <!-- Local SQLite Offline Badge -->
    <rect x="14" y="146" width="112" height="34" rx="6" fill="#132e36" />
    <text x="22" y="162" fill="#10b981" font-family="sans-serif" font-size="10" font-weight="bold">📱 SQLite Local DB</text>
    <text x="22" y="174" fill="#a7f3d0" font-family="sans-serif" font-size="8">100% Offline Ready</text>

    <!-- Product result card -->
    <rect x="14" y="188" width="112" height="52" rx="6" fill="rgba(16,185,129,0.15)" stroke="#10b981" />
    <text x="22" y="206" fill="#f0fdf4" font-family="sans-serif" font-size="10" font-weight="bold">Barcode 301762</text>
    <text x="22" y="220" fill="#34d399" font-family="sans-serif" font-size="9">Verified • Safe Ingredients</text>
    <text x="22" y="232" fill="#94a3b8" font-family="sans-serif" font-size="8">Latency: 4ms (Local)</text>
  </g>

  <!-- Middle Bridge: Caddy + Fastify Backend -->
  <g transform="translate(225, 80)">
    <rect width="160" height="245" rx="10" fill="#0d212b" stroke="rgba(6,182,212,0.4)" />
    <text x="16" y="26" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold">BACKEND MICROSERVICE</text>
    
    <rect x="12" y="42" width="136" height="50" rx="6" fill="#132c38" stroke="rgba(56,189,248,0.3)" />
    <text x="20" y="62" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold">Caddy Reverse Proxy</text>
    <text x="20" y="78" fill="#94a3b8" font-family="sans-serif" font-size="9">Auto HTTPS TLS 1.3 / HTTP/3</text>

    <rect x="12" y="104" width="136" height="60" rx="6" fill="#132c38" stroke="rgba(16,185,129,0.4)" />
    <text x="20" y="124" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="bold">Fastify TypeScript API</text>
    <text x="20" y="140" fill="#94a3b8" font-family="sans-serif" font-size="9">Strict Schema Validation</text>
    <text x="20" y="154" fill="#cbd5e1" font-family="sans-serif" font-size="8">Rate Limiting + Token Auth</text>

    <rect x="12" y="176" width="136" height="54" rx="6" fill="#132c38" stroke="rgba(139,92,246,0.4)" />
    <text x="20" y="196" fill="#c084fc" font-family="sans-serif" font-size="11" font-weight="bold">Drizzle ORM Engine</text>
    <text x="20" y="214" fill="#94a3b8" font-family="sans-serif" font-size="9">Zero-Overhead Queries</text>
  </g>

  <!-- Right: Storage & Cache Layer -->
  <g transform="translate(415, 80)">
    <rect width="150" height="245" rx="10" fill="#0d212b" stroke="rgba(16,185,129,0.4)" />
    <text x="16" y="26" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="bold">CACHE &amp; DATABASE</text>

    <rect x="12" y="44" width="126" height="84" rx="8" fill="#1a1528" stroke="#ec4899" stroke-width="1.5" />
    <text x="20" y="68" fill="#f472b6" font-family="sans-serif" font-size="11" font-weight="bold">⚡ Redis / Dragonfly</text>
    <text x="20" y="86" fill="#cbd5e1" font-family="sans-serif" font-size="9">Hot Key Lookups</text>
    <text x="20" y="102" fill="#10b981" font-family="sans-serif" font-size="9">Sub-millisecond hit</text>
    <text x="20" y="118" fill="#f472b6" font-family="sans-serif" font-size="8">TTL: 24h In-Memory</text>

    <rect x="12" y="142" width="126" height="88" rx="8" fill="#0f2a36" stroke="#06b6d4" stroke-width="1.5" />
    <text x="20" y="166" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold">🐘 PostgreSQL 16</text>
    <text x="20" y="184" fill="#cbd5e1" font-family="sans-serif" font-size="9">Docker Persistent Store</text>
    <text x="20" y="200" fill="#10b981" font-family="sans-serif" font-size="9">Multi-tenant indexing</text>
    <text x="20" y="216" fill="#94a3b8" font-family="sans-serif" font-size="8">WAL Backup + Auto-Sync</text>
  </g>

  <!-- Connectors -->
  <path d="M 185 200 L 225 200" stroke="#10b981" stroke-width="2" stroke-dasharray="4" />
  <path d="M 385 200 L 415 200" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4" />
</svg>
